<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="rot"><div class="ic">📱</div><div>Rotate to <b>landscape</b><br>to play <b>PEPE WICK</b></div></div>
<script>
"use strict";
/* ============================================================
   PEPE WICK — a 2D contract, Mario-school.
   The approved aesthetic: no line work, gradient moonlight,
   the reference face, the NFT arsenal in-hand.
   ============================================================ */
const cv=document.getElementById("c"), g=cv.getContext("2d");
const W=960,H=540;
let MOBILE=(('ontouchstart' in window)&&navigator.maxTouchPoints>0&&matchMedia("(pointer: coarse)").matches)||/[?&]mobile/.test(location.search); // coarse-pointer gate: touchscreen laptops keep mouse controls
const RES=MOBILE?1.5:2;                          // phones render 1440×810 instead of 1920×1080 — 44% fewer pixels per pass
cv.width=W*RES; cv.height=H*RES;
g.setTransform(RES,0,0,RES,0,0);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const dist2=(x1,y1,x2,y2)=>{const dx=x2-x1,dy=y2-y1;return dx*dx+dy*dy;};
const TAU=Math.PI*2;
/* tilt-to-steer (optional, mobile) */
const TILT_AVAIL=(typeof DeviceOrientationEvent!=="undefined");
let tiltOn=false; try{ tiltOn=localStorage.getItem("pw_tilt")==="1"; }catch(e){}
let tiltRoll=0, tiltNeutral=null, tiltHooked=false;
const TILT_DEAD=6, TILT_FULL=20; // degrees from neutral: deadzone → full lean
function tiltRollFrom(e){
  const ang=(screen.orientation&&screen.orientation.angle!=null)?screen.orientation.angle:(window.orientation||0);
  if(ang===90)return e.beta;
  if(ang===270||ang===-90)return -e.beta;
  return e.gamma; // portrait fallback (rotate overlay covers this)
}
function onOrient(e){
  if(e.beta==null&&e.gamma==null)return;
  const r=tiltRollFrom(e); if(r==null)return;
  if(tiltNeutral==null)tiltNeutral=r;   // first reading = the player's neutral hold
  tiltRoll=r;
}
function hookTilt(){ if(tiltHooked)return; tiltHooked=true; window.addEventListener("deviceorientation",onOrient); }
async function toggleTilt(){
  if(!tiltOn){
    // iOS 13+ needs a gesture-driven permission grant
    try{ if(DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==="function"){
      const g=await DeviceOrientationEvent.requestPermission(); if(g!=="granted"){ return; } } }catch(e){ return; }
    tiltOn=true; tiltNeutral=null; hookTilt();
  } else tiltOn=false;
  try{ localStorage.setItem("pw_tilt",tiltOn?"1":"0"); }catch(e){}
  SFX.tel();
}
if(tiltOn)hookTilt();   // restored from localStorage → the orientation listener must attach too
function tiltMove(){ // returns -1/0/1 steer from current tilt vs neutral
  if(!tiltOn||tiltNeutral==null)return 0;
  const d=tiltRoll-tiltNeutral;
  if(d>TILT_DEAD)return 1; if(d<-TILT_DEAD)return -1; return 0;
}

/* ---------- audio ---------- */
let AC=null,sfxOn=true,masterG=null;
function audio(){ if(AC)return AC; try{ AC=new (window.AudioContext||window.webkitAudioContext)(); masterG=AC.createGain(); masterG.gain.value=0.5; masterG.connect(AC.destination);}catch(e){} return AC; }
function blip(f0,f1,type,peak,dur,when){ const a=audio(); if(!a||!sfxOn)return; const t=when||a.currentTime;
  const o=a.createOscillator(),gn=a.createGain(); o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  gn.gain.setValueAtTime(peak,t); gn.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(gn); gn.connect(masterG); o.start(t); o.stop(t+dur+0.02); }
let noiseBuf=null;
function bang(peak,dur,hp,lp,when){ const a=audio(); if(!a||!sfxOn)return; const t=when||a.currentTime;
  if(!noiseBuf){ noiseBuf=a.createBuffer(1,a.sampleRate*0.5,a.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; }
  const s=a.createBufferSource(); s.buffer=noiseBuf;
  const gn=a.createGain(); gn.gain.setValueAtTime(peak,t); gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  let node=s;
  if(hp){ const f=a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp; node.connect(f); node=f; }
  if(lp){ const f=a.createBiquadFilter(); f.type="lowpass"; f.frequency.value=lp; node.connect(f); node=f; }
  node.connect(gn); gn.connect(masterG); s.start(t); s.stop(t+dur+0.02); }
const SFX={
  shot(sp){ bang(sp&&sp.pellets>1?0.5:0.35,sp&&sp.pellets>1?0.15:0.08,sp&&sp.pellets>1?300:700,0); blip(sp&&sp.pellets>1?130:220,60,"square",0.16,0.08); },
  hit(){ bang(0.22,0.05,1200,0); },
  kill(n){ blip(480*Math.pow(1.09,Math.min(n||1,12)),900,"triangle",0.17,0.14); },
  stomp(){ blip(240,90,"square",0.25,0.14); bang(0.3,0.08,300,0); },
  jump(){ blip(300,540,"sine",0.11,0.11); },
  coin(n){ blip(760*Math.pow(1.05,Math.min(n||0,12)),1500,"triangle",0.14,0.12); },
  crate(){ blip(420,220,"square",0.16,0.1); bang(0.2,0.07,500,0); },
  hurt(){ bang(0.45,0.22,0,900); blip(220,60,"sawtooth",0.28,0.28); },
  die(){ bang(0.55,0.4,0,800); blip(160,25,"sawtooth",0.38,0.5); },
  boom(){ bang(0.6,0.4,0,800); blip(90,25,"sine",0.5,0.45); },
  tel(){ blip(1150,900,"square",0.06,0.07); },
  check(){ const a=audio(); if(!a)return; [520,780].forEach((f,i)=>blip(f,f,"triangle",0.15,0.2,a.currentTime+i*0.08)); },
  door(){ const a=audio(); if(!a)return; [440,660,880,1100].forEach((f,i)=>blip(f,f,"triangle",0.16,0.25,a.currentTime+i*0.09)); },
  unlock(){ const a=audio(); if(!a)return; [520,660,880].forEach((f,i)=>blip(f,f,"triangle",0.16,0.2,a.currentTime+i*0.07)); }
};
/* music — noir synthwave loop */
let musicOn=true; try{ musicOn=localStorage.getItem("pw_music")!=="0"; }catch(e){}
let musStep=0, musNext=0, musKey=0, musBoss=0;
const MPENT=[0,3,5,7,10];
function musicTick(){
  const a=AC; if(!a||!musicOn||document.hidden)return;
  // ease "boss mode" intensity toward 1 when a boss is alive & on-screen in play
  let bossHot=0;
  try{ if(state==="play"&&P&&enemies&&enemies.some(e=>!e.dead&&(e.t==="zero"||e.t==="butcher")&&Math.abs(P.x-e.x)<900))bossHot=1; }catch(e){}
  musBoss+=(bossHot-musBoss)*0.10;
  const tr=Math.pow(2,musKey/12), bi=musBoss>0.02?musBoss:0; // transpose factor + boss intensity
  if(musNext<a.currentTime-0.5)musNext=a.currentTime+0.05;
  while(musNext<a.currentTime+0.3){
    const t=musNext, step=musStep%8, bar=(musStep>>3)%8;
    const root=[55,55,49,43.65,55,55,65.4,49][bar]*tr;
    if(step===0)blip(115*tr,38*tr,"sine",0.3,0.2,t);
    if(step===4){ blip(112*tr,36*tr,"sine",0.2,0.16,t); bang(0.06,0.05,5000,0,t); }
    if(step%2===0)bang(0.025,0.03,7000,0,t);
    if(step%2===0){ const f=root*2*(step===6?1.498:1); blip(f,f,"sawtooth",0.05,0.24,t); }
    if(bar%2===1&&step%2===1){ const f=220*tr*Math.pow(2,MPENT[(musStep>>1)%5]/12); blip(f,f*1.001,"triangle",0.028,0.3,t); }
    // boss layer: driving 16th hats, a minor-3rd tension drone, and a heavier kick — all fade with bi
    if(bi>0.02){
      if(step%2===1)bang(0.02*bi,0.02,8500,0,t);                          // off-beat hats → double-time feel
      if(step===0){ blip(root*1.5,root*1.5,"sawtooth",0.05*bi,0.5,t);      // fifth drone
                    blip(root*1.189,root*1.189,"square",0.035*bi,0.24,t); } // minor 3rd stab (tension)
      if(step===0||step===4)blip(110*tr,32*tr,"sine",0.14*bi,0.14,t);       // extra sub-kick
    }
    musNext+=60/96/2; musStep++;
  }
}
setInterval(musicTick,110);

/* ---------- the approved art kit (no line work) ---------- */
const BASE_PAL={
  skyTop:"#0b0e21", skyBot:"#2b2547", horizon:"#4a3a5e",
  moon:"#e8ecff", star:"#c9d4ff",
  far:"#181534", farLit:"#ffb64d",
  mid:"#211d3f", midLit:"#ff9d6e",
  slabTop:"#3d4468", slabTop2:"#262b4a", slabFace:"#191d33", slabFace2:"#10121f",
  lamp:"#ffb64d", accent:"#7cf9a5", sign:"#7cf9a5",
  fog:"rgba(90,80,140,0.14)"
};
let PAL={...BASE_PAL};
let curWeather="rain";
// per-district color grade + signature weather (index = level)
const THEMES=[
  {weather:"rain",   pal:{skyTop:"#08120f",skyBot:"#1c3327",horizon:"#2f5a44",far:"#122820",mid:"#193528",midLit:"#8fe0a0",farLit:"#7cf9a5",sign:"#7cf9a5",accent:"#7cf9a5",fog:"rgba(60,120,90,0.13)"}},
  {weather:"rain",   pal:{skyTop:"#070d1c",skyBot:"#16294a",horizon:"#2a4a70",far:"#101f3a",mid:"#182a48",midLit:"#8fd0ff",farLit:"#7fd0ff",sign:"#7fd0ff",accent:"#8fd0ff",fog:"rgba(90,130,190,0.14)"}},
  {weather:"embers", pal:{skyTop:"#150c08",skyBot:"#3a2214",horizon:"#5e3a22",far:"#241408",mid:"#2e1c10",midLit:"#ffcf8a",farLit:"#ffb64d",lamp:"#ffcf8a",sign:"#ffd75e",accent:"#ffd75e",fog:"rgba(150,110,70,0.12)"}},
  {weather:"fog",    pal:{skyTop:"#08120f",skyBot:"#152a2a",horizon:"#2a4a4a",far:"#0f2222",mid:"#152c2c",midLit:"#9fe0d0",farLit:"#7fd0c0",sign:"#7fd0c0",accent:"#7fd0c0",fog:"rgba(90,150,150,0.18)"}},
  {weather:"neon",   pal:{skyTop:"#12081c",skyBot:"#331646",horizon:"#5a2a70",far:"#22103a",mid:"#2c163f",midLit:"#ff8fd0",farLit:"#ff6fbf",sign:"#ff5fbf",accent:"#ff8fd0",fog:"rgba(180,80,180,0.14)"}},
  {weather:"mist",   pal:{skyTop:"#0a1018",skyBot:"#1c2e3e",horizon:"#3a5266",far:"#14222e",mid:"#1a2c3a",midLit:"#bcd8e8",farLit:"#9fc0d8",sign:"#9fd0e8",accent:"#bcd8e8",fog:"rgba(140,170,190,0.18)"}},
  {weather:"rain",   pal:{skyTop:"#0e0a1c",skyBot:"#251a46",horizon:"#443066",far:"#1a1236",mid:"#221a42",midLit:"#e0c0ff",farLit:"#ffd75e",lamp:"#ffd75e",sign:"#ffd75e",accent:"#c8a0ff",fog:"rgba(130,100,180,0.14)"}},
  {weather:"snow",   pal:{skyTop:"#0a121c",skyBot:"#1e3550",horizon:"#3e6488",far:"#14263a",mid:"#1a3048",midLit:"#dff0ff",farLit:"#bfe4ff",lamp:"#bfe4ff",sign:"#cfeeff",accent:"#dff0ff",fog:"rgba(170,200,230,0.20)"}},
  {weather:"embers", pal:{skyTop:"#150a0a",skyBot:"#341616",horizon:"#5a2c22",far:"#241010",mid:"#2c1614",midLit:"#ffa07a",farLit:"#ff8a5a",lamp:"#ff8a5a",sign:"#ff6b5a",accent:"#ff8a6a",fog:"rgba(150,70,50,0.14)"}},
  {weather:"ash",    pal:{skyTop:"#120507",skyBot:"#2c0c10",horizon:"#4a141a",far:"#1c0608",mid:"#240a0c",midLit:"#ff6b6b",farLit:"#ff4d4d",lamp:"#ff6b5a",sign:"#ff3d4d",accent:"#ff5555",fog:"rgba(140,30,30,0.16)"}},
];
const MUSKEY=[0,2,-2,3,5,-3,2,-4,1,-5]; // per-district musical transpose (semitones)
function applyTheme(i){ const th=THEMES[i]; PAL={...BASE_PAL, ...((th&&th.pal)||{})}; curWeather=(th&&th.weather)||"rain"; musKey=MUSKEY[((i%MUSKEY.length)+MUSKEY.length)%MUSKEY.length]||0; }
function drawWeather(t){
  const w=curWeather;
  const rain=al=>{ g.save(); g.strokeStyle="rgba(150,190,240,"+al+")"; g.lineWidth=1; g.beginPath();
    for(let i=0;i<22;i++){ const rx=((i*163+t*520-camX*0.6)%(W+40))-20, ry=((i*97+t*620)%(H+40))-20;
      g.moveTo(rx,ry); g.lineTo(rx-3,ry+13); } g.stroke(); g.restore(); };
  const blobs=(y,rgb,al,n)=>{ g.save(); g.globalCompositeOperation="lighter";
    for(let i=0;i<n;i++){ const bx=(((i*221+t*24-camX*0.3)%(W+300))+(W+300))%(W+300)-150;
      softGlow(bx,y+Math.sin(t*0.5+i)*14,110+((i*7)%60),rgb,al); } g.restore(); };
  const flakes=(rgb,al,spd,sway)=>{ g.save();
    for(let i=0;i<64;i++){ const sx=(((i*137-camX*0.5+Math.sin(t*0.6+i)*sway)%(W+40))+(W+40))%(W+40)-20;
      const sy=(((i*89+t*spd*(0.6+(i%3)*0.2))%(H+40))+(H+40))%(H+40)-20;
      g.fillStyle="rgba("+rgb+","+(al*(0.4+0.5*((i%4)/4)))+")"; g.beginPath(); g.arc(sx,sy,1+(i%3)*0.6,0,TAU); g.fill(); } g.restore(); };
  if(w==="snow"){ flakes("235,244,255",0.7,60,34); }
  else if(w==="ash"){ flakes("150,140,135",0.5,45,26); rain(0.04); }
  else if(w==="embers"){ g.save(); g.globalCompositeOperation="lighter";
    for(let i=0;i<44;i++){ const ex=(((i*151-camX*0.4+Math.sin(t*1.2+i)*18)%(W+40))+(W+40))%(W+40)-20;
      const ey=H-10-((i*67+t*80*(0.5+(i%3)*0.3))%(H+140)); const fl=0.35+0.4*Math.sin(t*4+i);
      g.fillStyle="rgba(255,"+(120+(i%3)*40)+",60,"+(0.4*fl)+")"; g.beginPath(); g.arc(ex,ey,1+(i%2),0,TAU); g.fill(); } g.restore(); }
  else if(w==="fog"){ blobs(250,"150,190,190",0.05,7); rain(0.06); }
  else if(w==="mist"){ blobs(H-70,"150,180,200",0.06,7); rain(0.05); }
  else if(w==="neon"){ blobs(260,"200,90,190",0.05,6); rain(0.06); }
  else { rain(0.09); }
}
function rr(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function capsule(x1,y1,x2,y2,r){ const a=Math.atan2(y2-y1,x2-x1);
  g.beginPath(); g.arc(x1,y1,r,a+Math.PI/2,a-Math.PI/2);
  g.arc(x2,y2,r,a-Math.PI/2,a+Math.PI/2); g.closePath(); }
function gv(x,y,h,c1,c2){ const gr=g.createLinearGradient(0,y,0,y+h); gr.addColorStop(0,c1); gr.addColorStop(1,c2); return gr; }
function softGlow(x,y,r,rgb,a){ const gr=g.createRadialGradient(x,y,r*0.05,x,y,r);
  gr.addColorStop(0,"rgba("+rgb+","+a+")"); gr.addColorStop(1,"rgba("+rgb+",0)");
  g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill(); }
function ao(x,y,rx,ry,a){ const gr=g.createRadialGradient(x,y,1,x,y,rx);
  gr.addColorStop(0,"rgba(4,6,14,"+a+")"); gr.addColorStop(1,"rgba(4,6,14,0)");
  g.fillStyle=gr; g.beginPath(); g.ellipse(x,y,rx,ry,0,0,TAU); g.fill(); }

/* ---------- the NFT arsenal ---------- */
const GUNDEFS={
  0:{name:"SIDEARM",tip:27.4,line:-19.6,rps:6.5,dmg:14,spread:0.012,pellets:1,auto:false,spd:1350},
  1:{name:"BOOGEYMAN P30",tip:31.4,line:-19.7,rps:8.5,dmg:17,spread:0.008,pellets:1,auto:false,spd:1450},
  2:{name:"CONTINENTAL VECTOR",tip:33,line:-19.1,grip:22,rps:13,dmg:8,spread:0.05,pellets:1,auto:true,spd:1250},
  3:{name:"KIMBER BREACHER",tip:38.6,line:-19.5,grip:25.5,rps:2,dmg:9,spread:0.1,pellets:6,auto:false,spd:1150},
  4:{name:"TTI MARKSMAN",tip:42,line:-18.7,grip:27,rps:2.6,dmg:34,spread:0.002,pellets:1,auto:false,pierce:2,spd:1850},
  5:{name:"EXCOMMUNICADO",tip:36.6,line:-19,grip:23,rps:9,dmg:15,spread:0.022,pellets:1,auto:true,spd:1450}
};
const HOLO_NAMES={11:"GOLD STANDARD",12:"THE IMPOSSIBLE",13:"HIGH TABLE",14:"TABULA RASA",15:"BABA YAGA"};
function gunRole(sp){
  if(sp.pellets>1)return sp.pellets+"-pellet shotgun";
  if(sp.pierce)return "piercing DMR";
  if(sp.auto)return sp.rps>=11?"full-auto SMG":"full-auto rifle";
  if(sp.rps>=8)return "rapid pistol";
  return "semi-auto sidearm";
}
function specFor(type){
  if(type==null)return GUNDEFS[0];
  if(GUNDEFS[type])return GUNDEFS[type];
  if(type>10&&GUNDEFS[type-10]){ const b=GUNDEFS[type-10];
    return Object.assign({},b,{dmg:Math.round(b.dmg*1.2),holo:true,name:HOLO_NAMES[type]||b.name}); }
  return GUNDEFS[0];
}
function drawGunInHand(type,kick,holo){
  g.save(); g.translate(-kick,0);
  const hue=(performance.now()/12)%360;
  const mk=(y,h,c1,c2)=>holo
    ? gv(0,y,h,"hsl("+hue+",92%,66%)","hsl("+((hue+60)%360)+",85%,48%)")
    : gv(0,y,h,c1,c2);
  const steel1="#4d5878", steel2="#262c44", dark1="#1c2136", dark2="#0f1222";
  const bt=type>10?type-10:type;
  if(bt===0){
    g.fillStyle=mk(-21.6,4,steel1,steel2); rr(13.2,-21.4,11,3.6,1.5); g.fill();
    g.fillStyle=mk(-18,5,dark1,dark2); rr(14.4,-18,3.4,4.4,1.2); g.fill();
  } else if(bt===1){
    g.fillStyle=mk(-21.8,4.2,steel1,steel2); rr(13,-21.7,13.4,3.9,1.6); g.fill();
    g.fillStyle=mk(-21.4,3.6,"#5d6a8e","#343c5c"); rr(26.6,-21.3,4.4,3.1,1.2); g.fill();
    g.fillStyle=mk(-18,5,dark1,dark2); rr(14.4,-18,3.6,4.6,1.2); g.fill();
    g.save(); g.globalCompositeOperation="lighter"; g.globalAlpha=0.4;
    g.fillStyle="#aebdf5"; rr(13.6,-21.5,12,1,0.5); g.fill(); g.restore();
  } else if(bt===2){

/* apply verified guns + remember them (24h cache) so returning players stay unlocked */
function applyGuns(types, addr, watch){
  types=Array.isArray(types)?types.filter(n=>typeof n==="number"&&isFinite(n)):[];   // poisoned cache can't half-apply
  ownedGunTypes=types; watchMode=!!watch;
  if(!watch)walletAddr=addr; else walletAddr=null;                    // watch mode can't sign scores
  let saved=null; try{ const s=localStorage.getItem("pw_loadout"); if(s!==null&&s!=="")saved=+s; }catch(e){}
  loadoutType=(saved!=null&&!isNaN(saved)&&types.includes(saved))?saved:(types[0]!=null?types[0]:null);
  walletStatus=types.length
    ? (watch?"👁 watch: ":"✓ ")+types.length+" gun"+(types.length>1?"s":"")+" unlocked"+(watch?" — connect to submit scores":"")
    : (watch?"👁 watching — no WICK guns at that address":"✓ connected — no WICK guns in wallet");
  try{ localStorage.setItem("pw_nft",JSON.stringify({addr,types,watch:!!watch,ts:Date.now()})); }catch(e){}
  if(types.length)SFX.unlock();
}
/* WAY 2 — WATCH MODE: paste any address, no wallet app needed (API lookup, on-chain RPC fallback) */
async function verifyWatch(addrRaw){
  if(walletBusy)return;                                             // never race a connect in progress
  if(walletAddr)return;                                             // a SIGNED session is never downgraded by a watch lookup
  const addr=String(addrRaw||"").trim();
  if(!/^0x[a-fA-F0-9]{40}$/.test(addr)){ walletStatus="that's not a wallet address (0x…)"; return; }
  walletBusy=true; walletStatus="looking up guns on-chain…";
  try{
    const r=await fetchT(NFT_VERIFY_URL+"?address="+addr); const data=await r.json();
    if(r.ok&&data.ok){ applyGuns([...new Set((data.guns||[]).map(x=>x.type))], addr, true); walletBusy=false; return; }
    if(/not configured/.test((data&&data.error)||"")){ walletStatus="⏳ guns contract goes live at mint — watch mode will work then"; walletBusy=false; return; }
    throw new Error((data&&data.error)||"api-down");
  }catch(e){
    try{ const types=await rpcGunsOf(addr); applyGuns(types, addr, true); }               // independent path: straight to PulseChain
    catch(e2){ walletStatus=ownedGunTypes.length?"👁 watch (cached — refresh failed)":"lookup failed — try again or use WALLET"; }
  }
  walletBusy=false;
}
/* direct eth_call WickGuns.gunsOfOwner(address) — no API, no wallet, just the chain */
async function rpcGunsOf(addr){
  if(/^0x0{40}$/.test(GUNS_ADDR))throw new Error("guns contract not deployed yet");
  const data="0x25a88846"+addr.slice(2).toLowerCase().padStart(64,"0");   // selector + abi-encoded address
  const r=await fetchT(PULSE_RPC,{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({jsonrpc:"2.0",id:1,method:"eth_call",params:[{to:GUNS_ADDR,data},"latest"]})});
  const j=await r.json(); if(!j.result||j.result==="0x")throw new Error("empty");
  const hex=j.result.slice(2), word=i=>parseInt(hex.slice(i*64,i*64+64),16);
  const tOff=word(1)/32, tLen=word(tOff), types=[];                        // second dynamic array = uint8[] types
  if(!isFinite(tOff)||!isFinite(tLen)||tLen>500)throw new Error("bad abi");  // malformed result must FAIL, not silently revoke guns
  for(let i=0;i<tLen;i++){ const v=word(tOff+1+i); if(isFinite(v))types.push(v); }
  return [...new Set(types)];
}

function gWaveComp(n){ // returns array of {t,delay} spawn descriptors for wave n
  const out=[]; let pool;
  if(n<3)      pool=["goon","goon","hound","goon"];
  else if(n<6) pool=["goon","hound","blade","heavy","goon"];
  else if(n<10)pool=["goon","hound","blade","heavy","shield","marksman","bomber"];
  else         pool=["goon","hound","blade","heavy","shield","marksman","bomber","goon","hound"];
  const count=Math.min(4+Math.floor(n*1.5),20);
  let d=0;
  for(let i=0;i<count;i++){ out.push({t:pool[(Math.floor(i*1.7)+n)%pool.length],delay:d}); d+=Math.max(0.28,0.85-n*0.04); }
  if(n%5===0)      out.push({t:"zero",delay:0.6});            // miniboss every 5th
  if(n%10===0)     out.push({t:"butcher",delay:0.9});         // boss capstone every 10th
  return out;
}
function nextWave(){
  gWave++;
  const comp=gWaveComp(gWave);
  gQueue=comp.map((c,i)=>({t:c.t, at:lvTime+0.2+c.delay, side:(i+gWave)%2?1:-1}));
  gBanner=2.2; gBannerTxt=(gWave%10===0)?"WAVE "+gWave+" — THE BUTCHER":(gWave%5===0)?"WAVE "+gWave+" — ZERO":"WAVE "+gWave;
  SFX.tel();
}
function gauntletTick(dt){
  gBanner=Math.max(0,gBanner-dt);
  // spawn any queued arrivals whose time has come
  if(gQueue.length){
    const still=[];
    for(const q of gQueue){
      if(lvTime>=q.at){
        const edge=q.side>0?lvl.len-40:40;
        const e=mkEnemy({t:q.t,x:edge,face:q.side>0?-1:1});
        enemies.push(e);
        for(let i=0;i<7;i++)parts.push({x:edge,y:GY-20,vx:rand(-90,90),vy:rand(-140,-20),t:rand(0.3,0.6),c:PAL.accent,r:rand(1.5,3),g:1});
      } else still.push(q);
    }
    gQueue=still;
  }
  // shepherd: spawned hunters ADVANCE on the player until their own AI takes over in range
  // (every enemy AI gates its approach on adx<~420, so edge-spawned waves would stall forever)
  { const HUNT={hound:190,blade:160,bomber:95,goon:80,marksman:70,shield:60,heavy:50,zero:110,butcher:60};
    for(const e of enemies){ if(e.dead)continue;                     // bosses hunt too — the arena is flat, no pit risk
      const adx=Math.abs(P.x-e.x);
      if(adx>360){ const dir=Math.sign(P.x-e.x)||1; e.x+=dir*(HUNT[e.t]||80)*dt; e.px=e.x; e.face=dir; e.dir=dir; } } }
  const alive=enemies.some(e=>!e.dead);
  if(!gQueue.length && !alive){
    if(gRestT<=0){ // wave cleared
      if(gWave>0){
        const bonus=250+gWave*120; lvScore+=bonus;
        floats.push({x:P.x,y:GY-140,txt:"WAVE "+gWave+" CLEAR  +"+bonus,t:1.6,size:14,c:"#ffd75e"});
        SFX.unlock();
        if(gWave%3===0 && P.hp<P.maxhp){ P.hp++; floats.push({x:P.x,y:GY-118,txt:"+♥",t:1.2,size:16,c:"#ff6b8a"}); SFX.coin(9); }
        applyTheme(gWave%10); // rotate district look each wave
      }
      gRestT=gWave===0?0.6:1.6;
    }
    gRestT-=dt;
    if(gRestT<=0) nextWave();
  }
}
function endGauntlet(){
  gRestT=0; gQueue=[];
  if(lvScore>gBest){ gBest=Math.floor(lvScore); try{ localStorage.setItem("pw_gbest",String(gBest)); }catch(e){} }
  lbMsg=""; state="gover"; deadT=0;
}

function tutTick(dt){
  const s=TUT_STEPS[tutStep]; if(!s){ tutStep=-1; return; }
  tutAge+=dt;
  const ok = s.k==="move"?Math.abs(P.vx)>60 : s.k==="jump"?tutJumped : s.k==="fire"?tutFired : lvKills>0;
  if(ok) tutHold+=dt; else tutHold=0;
  const need = s.k==="move"?0.4:0.12;
  const timeout = s.k==="move"?14:12; // generous auto-advance so the prompt never soft-locks
  const minShow = 1.1;                // each step stays readable ≥1.1s even if auto-fire satisfies it instantly
  if(((ok&&tutHold>=need)&&tutAge>=minShow)||tutAge>=timeout){ tutStep++; tutHold=0; tutAge=0; if(tutStep>=TUT_STEPS.length)tutFinish(); }
}
function tutFinish(){ tutStep=-1; tutDone=true; try{ localStorage.setItem("pw_tut","1"); }catch(e){}
  floats.push({x:P.x,y:GY-120,txt:"GET THE DOG BACK →",t:2.2,size:14,c:"#7cf9a5"}); SFX.check(); }
function drawTut(){
  if(tutStep<0||tutStep>=TUT_STEPS.length)return;
  const s=TUT_STEPS[tutStep], w=452, x=W/2-w/2, y=H-96, pulse=0.5+0.5*Math.sin(performance.now()/300);
  g.save(); g.textAlign="center";
  g.fillStyle="rgba(6,10,20,0.84)"; rr(x,y,w,52,12); g.fill();
  g.strokeStyle="rgba(124,249,165,"+(0.35+pulse*0.4)+")"; g.lineWidth=2; rr(x,y,w,52,12); g.stroke();
  g.font="900 22px Verdana"; g.fillStyle="#7cf9a5"; g.textAlign="left"; g.fillText(s.ic,x+22,y+33);
  g.textAlign="center"; g.font="900 14px Verdana"; g.fillStyle="#e8e8ea";
  const txt = MOBILE ? (s.k==="move"?"MOVE — hold the LEFT side & slide":s.k==="jump"?"JUMP — tap the RIGHT side (hold = higher)":s.k==="fire"?"you AUTO-FIRE — just face the enemy":"KILL — shots, or LAND ON HEADS") : s.txt;
  g.fillText(txt,W/2+16,y+28);
  for(let i=0;i<TUT_STEPS.length;i++){ g.fillStyle=i<tutStep?"#7cf9a5":i===tutStep?"#fff":"rgba(255,255,255,0.22)";
    g.beginPath(); g.arc(W/2-24+i*16,y+42,3.2,0,TAU); g.fill(); }
  g.restore();
}
/* ---------- boss spectacle ---------- */
function drawBossBar(){
  let boss=null; for(const e of enemies){ if(!e.dead&&(e.t==="butcher"||e.t==="zero")&&Math.abs(P.x-e.x)<W){ boss=e; break; } }
  if(!boss||bossIntro>0.5)return;
  const isB=boss.t==="butcher", name=isB?"THE BUTCHER":"ZERO";
  const bw=Math.min(W-140,520), x=W/2-bw/2, y=32, frac=clamp(boss.hp/boss.maxhp,0,1);
  g.save(); g.textAlign="center";
  g.font="900 13px Verdana"; g.fillStyle=isB?"#ff5a5a":"#c9a6ff";
  g.fillText(name+(isB&&boss.phase>=3?"  —  ENRAGED":""),W/2,y-6);
  g.fillStyle="rgba(0,0,0,0.55)"; rr(x-2,y-2,bw+4,12,4); g.fill();
  g.fillStyle="rgba(255,255,255,0.12)"; rr(x,y,bw,8,3); g.fill();
  const grd=g.createLinearGradient(x,0,x+bw,0);
  grd.addColorStop(0,isB?"#ff2a2a":"#8a5cff"); grd.addColorStop(1,isB?"#ff9a5a":"#c9a6ff");
  g.fillStyle=grd; rr(x,y,bw*frac,8,3); g.fill();
  if(isB){ g.fillStyle="rgba(0,0,0,0.6)"; g.fillRect(x+bw*0.34,y,2,8); g.fillRect(x+bw*0.67,y,2,8); }
  g.restore();
}
function drawBossIntro(){
  if(bossIntro<=0)return;
  const bar=clamp(Math.min(bossIntro,2.6-bossIntro)*3,0,1)*72;
  g.fillStyle="rgba(0,0,0,0.9)"; g.fillRect(0,0,W,bar); g.fillRect(0,H-bar,W,bar);
  const name=bossIntroKind==="butcher"?"THE BUTCHER":"ZERO";
  const sub=bossIntroKind==="butcher"?"NO WAY THROUGH BUT ONE":"THE RIVAL — ZERO";
  const slam=clamp((2.6-bossIntro)/1.1,0,1), sc=1.7-0.7*slam;
  g.save(); g.textAlign="center"; g.translate(W/2,H/2-6); g.scale(sc,sc);
  g.globalAlpha=clamp(bossIntro*1.6,0,1);
  g.shadowColor="#ff2a2a"; g.shadowBlur=32;
  g.font="900 54px Verdana"; g.lineWidth=6; g.strokeStyle="rgba(0,0,0,0.85)"; g.strokeText(name,0,0);
  g.fillStyle="#ff3b3b"; g.fillText(name,0,0);
  g.shadowBlur=0; g.font="bold 15px Verdana"; g.fillStyle="#e8b04a"; g.fillText(sub,0,34);
  g.restore();
}
function floorAt(x){ for(const f of lvl.floors){ if(x>=f[0]&&x<=f[1])return GY; } return 1e9; }
function groundAt(x,y){
  let gy=floorAt(x)>1e8?1e9:GY;
  for(const l of lvl.ledges){ if(x>=l.x-4&&x<=l.x+l.w+4&&l.y>=y-24&&l.y<gy)gy=l.y; }
  return gy;
}

/* ---------- combat ---------- */
function fireGun(){
  const sp=specFor(loadoutType);
  if(P.cool>0||P.dead)return;
  P.cool=1/sp.rps; P.muzzle=0.06; tutFired=true;
  SFX.shot(sp);
  const bt=(loadoutType>10?loadoutType-10:loadoutType)||0;
  // muzzle origin: sprite gun tip when the raster hero is active (class-aware reach), else the vector gun tip
  const sprFwd = gunCls(loadoutType||0)==="rifle" ? 34 : 24;
  const tipx = heroReady()? P.x+P.face*(sprFwd+HERO_MUZ.x) : P.x+P.face*(GUNDEFS[bt].tip-1)*1.15;
  const tipy = heroReady()? P.y-(27+HERO_MUZ.y) : P.y-34.6*1.15;
  if(!MOBILE)shells.push({x:P.x+P.face*8,y:tipy+3,vx:-P.face*rand(60,130),vy:rand(-200,-130),rot:rand(0,6),vrot:rand(-14,14),t:rand(0.8,1.2)}); // casings are desktop garnish — auto-fire phones skip them
  const n=sp.pellets||1;
  for(let i=0;i<n;i++){
    const spr=(Math.random()-0.5)*2*sp.spread+(n>1?(i-(n-1)/2)*0.05:0);
    pbullets.push({x:tipx,y:tipy,vx:P.face*sp.spd*Math.cos(spr),vy:sp.spd*Math.sin(spr),dmg:sp.dmg,pierce:sp.pierce||0,holo:!!sp.holo,life:0.7});
  }
  shake=Math.max(shake,0.05+(n>1?0.1:0));
}
function killEnemy(e,dx){
  e.dead=true; lvKills++;
  const BON={heavy:150,shield:120,marksman:90,bomber:60,hound:40,zero:900,butcher:2600};
  if(e.noReward){ /* suicide detonation: no score, no combo */ }
  else if(e.summoned){ combo++; comboT=2.2; lvScore+=25; }   // boss adds are chaff — no farming the signed board
  else { combo++; comboT=2.2; lvScore+=(100+combo*15+(BON[e.t]||0)); }
  if(e.t==="bomber"&&!e.boomed){ e.boomed=true; fuses.push({x:e.x,y:e.y-14,t:0.12}); }
  const boss=e.t==="zero"||e.t==="butcher";
  if(boss){ shake=Math.max(shake,0.8); hitstop=Math.max(hitstop,0.18); flash=Math.max(flash,0.32); flashRGB="255,220,120";
    floats.push({x:e.x,y:e.y-96,txt:e.t==="butcher"?"THE BUTCHER FALLS":"ZERO DOWN",t:1.6,size:16,c:"#ffd75e"});
    for(let i=0;i<30;i++)parts.push({x:e.x,y:e.y-30,vx:rand(-260,260),vy:rand(-340,40),t:rand(0.4,0.9),c:pick(["#ffd23f","#ff6680","#fff"]),r:rand(2,4),g:1});
    parts.push({x:e.x,y:e.y-30,vx:0,vy:0,t:0.5,c:"#ffd75e",r:44,ring:1}); }
  hitstop=Math.max(hitstop,0.06+Math.min(combo,8)*0.011); shake=Math.max(shake,0.34+Math.min(combo,8)*0.02);
  zoomP=Math.min(1,zoomP+0.52);
  if(!boss && combo>=8){ flash=Math.max(flash, Math.min(0.10,(combo-7)*0.02)); if(flash<0.5)flashRGB="255,248,235"; }
  SFX.kill(combo); bang(0.34,0.15,170,920); // meat thump under the chime
  // ragdoll flies back HARD
  corpses.push({x:e.x,y:e.y,vx:(dx||1)*rand(280,460),vy:rand(-400,-260),rot:0,vrot:(dx||1)*rand(5,12),t:1.5,heavy:e.t==="heavy"});
  // blood: directional spray + a soft mist puff (phones: half the droplets, same read)
  const nBl=MOBILE?10:20, nMi=MOBILE?2:4;
  for(let i=0;i<nBl;i++)parts.push({x:e.x,y:e.y-24,vx:(dx||1)*rand(60,320)+rand(-90,90),vy:rand(-300,60),t:rand(0.3,0.72),c:pick(["#ff3355","#c11235","#ff6680","#8a0f22"]),r:rand(1.4,3.8),g:1});
  for(let i=0;i<nMi;i++)parts.push({x:e.x+rand(-8,8),y:e.y-26+rand(-10,10),vx:(dx||1)*rand(20,80),vy:rand(-40,10),t:rand(0.35,0.6),c:"rgba(150,20,30,0.5)",r:rand(6,11),g:0});
  parts.push({x:e.x,y:e.y-24,vx:0,vy:0,t:0.3,c:"#fff",r:18,ring:1});
  if(combo>1)floats.push({x:e.x,y:e.y-52,txt:combo+"×",t:0.7,size:13+Math.min(combo*1.4,12),c:"#fff"});
  // cross-flash at the kill point
  parts.push({x:e.x,y:e.y-26,vx:0,vy:0,t:0.16,cross:1,c:"#fff",r:16});
  // quick multi-kill bonus (real kills only — no farming boss adds or suicide bombers)
  const nowT=lvTime;
  if(!e.noReward&&!e.summoned){
    if(nowT-lastKillT<0.5){ lvScore+=100;
      floats.push({x:e.x,y:e.y-84,txt:"DOUBLE KILL +100",t:0.8,size:13,c:"#ff9d3d"}); }
    lastKillT=nowT;
  }
  if(combo===3){ styleTxt="DOUBLE TAP"; styleT=1; }
  else if(combo===5){ styleTxt="RAMPAGE"; styleT=1.1; }
  else if(combo===8){ styleTxt="BABA YAGA"; styleT=1.3; }
}
function boomAt(x,y){
  SFX.boom(); shake=Math.max(shake,0.5); hitstop=Math.max(hitstop,0.05);
  parts.push({x,y,vx:0,vy:0,t:0.4,c:"#ffd9a0",r:46,ring:1});
  for(let i=0;i<18;i++)parts.push({x:x+rand(-8,8),y:y+rand(-8,8),vx:rand(-300,300),vy:rand(-320,80),t:rand(0.3,0.65),c:pick(["#ffd23f","#ff9d3d","#ff5f3d"]),r:rand(2,4.4),g:1});
  for(const e of enemies){ if(!e.dead&&dist2(e.x,e.y-16,x,y)<120*120){
    if(e.t==="butcher"||e.t==="zero"){ e.hp-=90; e.hurtT=0.2; if(e.hp<=0)killEnemy(e,Math.sign(e.x-x)); } // bosses take heavy damage, never insta-die
    else killEnemy(e,Math.sign(e.x-x)); } }
  for(const k of kegs){ if(!k.dead&&dist2(k.x,k.y-14,x,y)<110*110){ k.dead=true; fuses.push({x:k.x,y:k.y-14,t:0.3}); } }
  if(!P.dead&&P.ifr<=0&&dist2(P.x,P.y-16,x,y)<100*100)hurtPlayer();
}
function poundShock(x){ // butcher ground-slam — jump to avoid
  SFX.boom(); shake=Math.max(shake,0.5); hitstop=Math.max(hitstop,0.05);
  parts.push({x,y:GY-6,vx:0,vy:0,t:0.4,c:"#ffd9a0",r:64,ring:1});
  for(let i=0;i<14;i++)parts.push({x:x+rand(-34,34),y:GY-6,vx:rand(-280,280),vy:rand(-220,-20),t:rand(0.3,0.6),c:pick(["#c9b28c","#8a7050"]),r:rand(2,4),g:1});
  if(!P.dead&&P.ifr<=0&&P.grounded&&Math.abs(P.y-GY)<8&&Math.abs(P.x-x)<150)hurtPlayer(Math.sign(P.x-x)||1); // the shockwave runs along the STREET — platforms are safe
}
function spawnGoon(x){ enemies.push({t:"goon",x:clamp(x,60,lvl.len-60),y:GY,hp:28,maxhp:28,face:-1,dead:false,cd:rand(0.6,1.2),tel:0,muzzle:0,walk:0,px:x,dir:-1,patrol:70,fuse:0,block:0,phase:1,summoned:1}); }
function hurtPlayer(knock){
  if(P.dead||P.ifr>0||state!=="play")return;
  P.hp--; P.ifr=1.2; combo=0;
  P.vx=(knock||-P.face)*260; P.vy=-240; P.grounded=false;
  shake=Math.max(shake,0.45); SFX.hurt();
  for(let i=0;i<8;i++)parts.push({x:P.x,y:P.y-18,vx:rand(-160,160),vy:rand(-220,30),t:rand(0.3,0.5),c:pick(["#6aa84f","#e8e8ea"]),r:rand(1.5,3),g:1});
  if(P.hp<=0){ P.dead=true; deadT=0; SFX.die();
    for(let i=0;i<22;i++)parts.push({x:P.x,y:P.y-18,vx:rand(-300,300),vy:rand(-360,60),t:rand(0.4,0.9),c:pick(["#6aa84f","#161a26","#e8e8ea"]),r:rand(2,4),g:1});
    if(gauntlet)endGauntlet(); else state="dead";
  }
}
function pitFall(){
  if(P.dead)return;
  P.hp--; SFX.hurt(); shake=0.5;
  if(P.hp<=0){ P.dead=true; deadT=0; SFX.die(); if(gauntlet)endGauntlet(); else state="dead"; return; }
  P.x=checkpointX; P.y=GY-40; P.vx=0; P.vy=0; P.ifr=1.4;
}
function popCoins(x,y,n){ // cases pay out score straight up
  lvScore+=240;
  floats.push({x,y:y-14,txt:"CASE +240",t:0.8,size:12,c:"#ffd75e"});
  for(let i=0;i<8;i++)parts.push({x,y,vx:rand(-160,160),vy:rand(-260,-80),t:rand(0.3,0.55),c:"#ffd75e",r:rand(1.5,2.6),g:1});
  if(Math.random()<0.55)hearts.push({x,y:y-6,vx:rand(-60,60),vy:-280});
}

/* ---------- update ---------- */
let keys=new Set(), firing=false, keyFiring=false;   // mouse and keyboard fire are independent holds
function update(dt){
  if(state!=="play"){ shake=Math.max(0,shake-dt*2.8); flash=Math.max(0,flash-dt*3.8); bossIntro=0; } // end screens settle, never jitter
  if(state==="clear"){ clearT+=dt; return; }
  if(state==="dead"||state==="gover"){ deadT+=dt; return; }
  if(state==="ending"){ endT+=dt; return; }
  if(state!=="play")return;
  if(hitstop>0){ hitstop-=dt; return; }
  lvTime+=dt; introT=Math.max(0,introT-dt);
  shake=Math.max(0,shake-dt*2.8); flash=Math.max(0,flash-dt*3.8);
  comboT-=dt; if(comboT<=0)combo=0;
  if(tutStep>=0)tutTick(dt);
  // cinematic boss entrance — first time a boss comes on-screen (story only; gauntlet uses its wave banner)
  if(!gauntlet&&bossIntro<=0){ for(const e of enemies){ if(!e.dead&&(e.t==="butcher"||e.t==="zero")&&!e.introShown&&Math.abs(P.x-e.x)<W*0.8){
    e.introShown=true; bossIntro=2.6; bossIntroKind=e.t; hitstop=Math.max(hitstop,0.14); shake=Math.max(shake,0.7);
    flash=Math.max(flash,0.26); flashRGB="255,80,60"; SFX.boom(); break; } } }
  bossIntro=Math.max(0,bossIntro-dt);
  const sp=specFor(loadoutType);
  /* player */
  P.ifr=Math.max(0,P.ifr-dt); P.cool-=dt; P.muzzle=Math.max(0,P.muzzle-dt);
  P.coyote=Math.max(0,P.coyote-dt); P.jbuf=Math.max(0,P.jbuf-dt); P.dropT=Math.max(0,P.dropT-dt);
  let mx=0;
  if(keys.has("KeyA")||keys.has("ArrowLeft"))mx-=1;
  if(keys.has("KeyD")||keys.has("ArrowRight"))mx+=1;
  if(MOBILE&&tiltOn){ const ts=tiltMove(); if(ts)mx=clamp(mx+ts,-1,1); }
  if(mx!==0){ P.vx=clamp(P.vx+mx*2800*dt,-330,330); P.face=mx; }
  else { const s2=Math.sign(P.vx); P.vx-=s2*Math.min(Math.abs(P.vx),2200*dt); }
  // jumping: buffer + coyote + variable height (generous windows so edge presses always register)
  if(P.jbuf>0&&(P.grounded||P.coyote>0)){
    P.jbuf=0; P.coyote=0; P.grounded=false; P.vy=-645; SFX.jump(); tutJumped=true;
    for(let i=0;i<4;i++)parts.push({x:P.x+rand(-7,7),y:P.y-1,vx:rand(-60,60),vy:rand(-40,0),t:0.3,c:"#3a4258",r:2,g:1});
  }
  const rising=P.vy<0&&P.jumpHeld;
  P.vy+=(rising?1080:1760)*dt;
  if(P.vy>680)P.vy=680;
  P.x+=P.vx*dt; P.y+=P.vy*dt;
  if(P.grounded)P.stride=(P.stride||0)+Math.abs(P.vx)*dt;   // ground distance — drives the leg cycle so feet don't slide
  P.x=clamp(P.x,20,lvl.len-20);
  const wasGrounded=P.grounded;
  const gy=groundAt(P.x,P.y-2+(P.dropT>0?26:0));
  P.grounded=false;
  if(P.y>=gy&&gy<1e8&&P.vy>=0&&(P.dropT<=0||gy>=GY-0.5)){ P.y=gy;   // S drops through LEDGES only — the street always catches you
    if(!wasGrounded){ P.squash=Math.min(0.5,Math.abs(P.vy)/1400);
      for(let i=0;i<4;i++)parts.push({x:P.x+rand(-9,9),y:P.y-2,vx:rand(-80,80),vy:rand(-50,-8),t:rand(0.2,0.34),c:"#3a4258",r:rand(1.4,2.6),g:1}); }
    P.vy=0; P.grounded=true;
  }
  if(P.grounded)P.coyote=0.14;
  if(P.y>H+70)pitFall();
  if(((firing||keyFiring)&&sp.auto)||(MOBILE&&!P.dead))fireGun(); // mobile: auto-fire in facing direction
  if(gauntlet){ gauntletTick(dt); }
  else {
  /* checkpoints */
  for(const c of lvl._checks){ if(!c.lit&&P.x>c.x){ c.lit=true; checkpointX=c.x; SFX.check();
    floats.push({x:c.x,y:GY-120,txt:"CHECKPOINT",t:1,size:12,c:"#7cf9a5"}); } }
  /* door + cage */
  const bossAlive=!!lvl.boss&&enemies.some(e=>!e.dead&&e.t==="butcher");
  if(lvl.cage&&cageOpenT<0&&bossAlive&&Math.abs(P.x-lvl.cage)<80&&!P.dead){
    if(lvTime-(lastBossHint||-9)>3){ lastBossHint=lvTime;
      floats.push({x:lvl.cage,y:GY-120,txt:"KILL THE BUTCHER FIRST",t:1.6,size:12,c:"#ff6680"}); }
  }
  if(lvl.cage&&cageOpenT<0&&!bossAlive&&Math.abs(P.x-lvl.cage)<30){
    cageOpenT=0; SFX.unlock(); lvScore+=1000;
    floats.push({x:lvl.cage,y:GY-110,txt:"BISCUIT!",t:1.4,size:18,c:"#e8b04a"});
    for(let i=0;i<8;i++)parts.push({x:lvl.cage,y:GY-40,vx:rand(-40,40),vy:rand(-90,-30),t:0.9,c:"#ff6b8a",r:2.6,heart:1});
  }
  if(cageOpenT>=0)cageOpenT+=dt;
  const leftAlive=enemies.reduce((n,e)=>n+(e.dead?0:1),0);
  const doorReady=(!lvl.cage||cageOpenT>=0)&&leftAlive===0;          // the district must be CLEARED — no running past the work
  if(Math.abs(P.x-lvl.door)<40&&P.grounded&&leftAlive>0&&!P.dead){
    if(lvTime-(lastDoorHint||-9)>2.5){ lastDoorHint=lvTime;
      floats.push({x:lvl.door,y:GY-130,txt:"CLEAR THE DISTRICT — "+leftAlive+" LEFT",t:1.6,size:13,c:"#ff6680"}); SFX.tel(); }
  }
  if(doorReady&&Math.abs(P.x-lvl.door)<24&&P.grounded){
    onClear(); return;
  }
  }
  /* camera */
  zoomP=Math.max(0,zoomP-dt*2.6);
  const targ=clamp(P.x-W/2+P.face*105,0,lvl.len-W);
  camX=lerp(camX,targ,Math.min(1,dt*6.4));
  /* player bullets */
  for(const b of pbullets){
    b.life-=dt; if(b.life<=0){ b.dead=true; continue; }
    const nx=b.x+b.vx*dt, ny=b.y+b.vy*dt;
    for(const e of enemies){
      if(e.dead)continue;
      if(b.hitSet&&b.hitSet.has(e))continue;      // a piercing round hits each enemy once, then passes through
      const big=e.t==="butcher", z=e.t==="zero";
      const hc=e.t==="heavy"?33:big?48:z?36:e.t==="hound"?22:e.t==="bomber"?31:29;
      const hr=e.t==="heavy"?31:big?54:z?34:e.t==="hound"?26:25;
      if(segHit(b.x,b.y,nx,ny,e.x,e.y-hc,hr)){
        (b.hitSet||(b.hitSet=new Set())).add(e);
        // riot shield eats frontal body shots — jump-fire over the top or stomp it
        if(e.t==="shield"&&ny>e.y-44){
          b.dead=true; e.block=0.14; SFX.hit();
          for(let i2=0;i2<3;i2++)parts.push({x:b.x,y:b.y,vx:Math.sign(b.vx)*-rand(30,90),vy:rand(-70,20),t:0.2,c:"#bcd0ff",r:rand(1.4,2.4),g:1});
          if(!shieldHintShown){ shieldHintShown=true; floats.push({x:e.x,y:e.y-72,txt:"JUMP ON THE SHIELD!",t:1.6,size:12,c:"#bcd0ff"}); }
          break;
        }
        const critLine=e.y-(e.t==="heavy"?52:big?70:z?54:44);
        const crit=ny<critLine; // headshots: jump-fire over their eyeline
        let dmg2=crit?Math.round(b.dmg*1.5):b.dmg;
        e.pitBlockT=Math.max(0,(e.pitBlockT||0)-0.016);
        if((big||z)&&e.pitBlockT>0&&Math.abs(P.x-e.x)>200){ dmg2=Math.max(1,Math.round(dmg2*0.3));   // no free boss kills from across a gap
          if(Math.random()<0.05)floats.push({x:e.x,y:e.y-100,txt:"COME CLOSER.",t:1,size:12,c:"#ff8a8a"}); }
        e.hp-=dmg2; e.hurtT=0.12; if(!big&&!z)e.kb=(e.kb||0)+Math.sign(b.vx)*5; // knockback applied in the enemy pass (pit-guard aware)
        if(crit){ floats.push({x:e.x,y:e.y-70,txt:"CRIT!",t:0.5,size:11,c:"#ffd75e"}); blip(1500,2600,"triangle",0.14,0.1); lvScore+=25;
          if(!e.dead){ flash=Math.max(flash,0.06); flashRGB="255,235,150"; hitstop=Math.max(hitstop,0.03); } }
        SFX.hit();
        for(let i2=0;i2<3;i2++)parts.push({x:b.x,y:b.y,vx:Math.sign(b.vx)*rand(20,120)+rand(-40,40),vy:rand(-90,30),t:rand(0.15,0.3),c:pick(["#ff6680","#ff3355"]),r:rand(1.5,2.5),g:1});
        if(e.hp<=0)killEnemy(e,Math.sign(b.vx));
        if(b.pierce>0)b.pierce--; else b.dead=true;
        break;
      }
    }
    if(b.dead)continue;
    for(const k of kegs){ if(!k.dead&&segHit(b.x,b.y,nx,ny,k.x,k.y-14,16)){
      k.dead=true; b.dead=true; fuses.push({x:k.x,y:k.y-14,t:0.35}); SFX.tel();
      parts.push({x:k.x,y:k.y-14,vx:0,vy:0,t:0.2,c:"#ffd23f",r:8,ring:1}); break; } }
    if(b.dead)continue;
    for(const c of crates){ if(!c.used&&Math.abs(nx-c.x)<15&&Math.abs(ny-c.y)<15){
      c.used=true; b.dead=true; SFX.crate(); popCoins(c.x,c.y-8,5); break; } }
    b.x=nx; b.y=ny;

function segHit(x1,y1,x2,y2,cx2,cy2,r){

function onClear(){
  SFX.door();

  const r=(deathsThisRun===0&&lvTime<=rk.s*1.35)?"S":lvTime<=rk.a*1.35?"A":lvTime<=rk.b*1.35?"B":"C";   // full-clear runs take longer — clocks widened
  lvScore+={S:3000,A:1500,B:600,C:200}[r];
  const key="l"+lvIdx, b=best[key]||{};
  if(!b.time||lvTime<b.time)b.time=+lvTime.toFixed(2);
  const RORD={S:4,A:3,B:2,C:1};
  if(!b.rank||(RORD[r]||0)>=(RORD[b.rank]||0))b.rank=r;   // best rank is kept — a fast sloppy run can't erase an S
  if(!b.score||lvScore>b.score)b.score=lvScore;
  if(boneGot)b.bone=true;
  best[key]=b;
  try{ localStorage.setItem("pw_best",JSON.stringify(best)); }catch(e){}
  if(lvIdx===LEVELS.length-1){ state="ending"; endT=0; lbMsg=""; try{ localStorage.setItem("pw_done","1"); }catch(e){} }
  else { state="clear"; clearT=0; }
}

    g.beginPath(); g.ellipse(px+pw/2,GY+7,pw/2.6,3.4,0,0,TAU); g.fill();
    if(Math.abs(P.x-(px+pw/2))<pw/2&&P.grounded&&Math.abs(P.vx)>60&&Math.random()<0.2)
      parts.push({x:P.x,y:GY+4,vx:0,vy:0,t:0.3,c:"#9fc3ff",r:4,ring:1});
    g.restore();
  }
  // steam vents
  for(const vx of (lvl.vents||[])){
    g.fillStyle="#141a2c"; rr(vx-14,GY-6,28,8,3); g.fill();
    g.save(); g.globalCompositeOperation="lighter";
    for(let i=0;i<3;i++){ const ph2=(t*0.6+i*0.33)%1;
      g.globalAlpha=(1-ph2)*0.12;
      g.fillStyle="#9fb4d8";
      g.beginPath(); g.ellipse(vx+Math.sin(t*2+i)*6,GY-10-ph2*60,7+ph2*12,10+ph2*14,0,0,TAU); g.fill(); }
    g.restore();
  }
  for(const l of lvl.lamps){ drawLamp(l,GY,1);
    // moths circling the lamp head
    g.save(); g.globalCompositeOperation="lighter";
    for(let i=0;i<3;i++){ const a=t*(2.2+i*0.5)+i*2.1;
      const mx2=l+Math.cos(a)*(10+i*4), my2=GY-90+Math.sin(a*1.7)*7;
      g.globalAlpha=0.35+0.25*Math.sin(a*3);
      g.fillStyle="#ffe9c9"; g.beginPath(); g.arc(mx2,my2,1.3,0,TAU); g.fill(); }
    g.restore();
  }
  for(const c of lvl._checks)if(c.x)drawLamp(c.x,GY,0.85,c.lit?"check":undefined);
  drawAC(430+((lvIdx*777)%300),GY,1.1);
  for(const c of crates)drawCrate(c.x,c.y,1,c.used);
  for(const k of kegs){ if(k.dead)continue;
    g.save(); g.translate(k.x,k.y);
    g.fillStyle=gv(0,-30,30,"#7a2020","#4a1010"); rr(-11,-30,22,30,3); g.fill();
    g.fillStyle=gv(0,-30,8,"#8e3030","#7a2020"); rr(-11,-30,22,8,3); g.fill();
    g.fillStyle="#ffd23f"; g.font="900 12px Verdana"; g.textAlign="center"; g.fillText("!",0,-12);
    g.restore(); }
  // BISCUIT's bone — the secret collectible
  if(lvl.bone&&!boneGot){
    const bn=lvl.bone, bob2=Math.sin(t*3)*4;
    g.save(); g.translate(bn.x,bn.y+bob2);
    g.save(); g.globalCompositeOperation="lighter"; softGlow(0,0,20,"255,214,150",0.25); g.restore();
    g.fillStyle=gv(0,-5,10,"#f2ead8","#c9bda0");
    rr(-8,-2.4,16,4.8,2.4); g.fill();
    for(const ex2 of [-8,8])for(const ey2 of [-3,3]){
      g.beginPath(); g.arc(ex2,ey2*0.8,3.4,0,TAU); g.fill(); }
    g.restore();
  }
  // ragdolls + shells
  for(const c of corpses){
    g.save(); g.translate(c.x,c.y-9); g.rotate(c.rot);
    g.globalAlpha=clamp(c.t/0.5,0,1);
    const sc=c.heavy?1.25:1;
    g.fillStyle=gv(0,-8*sc,16*sc,"#232840","#12152a");
    rr(-13*sc,-7*sc,26*sc,13*sc,4); g.fill();
    g.fillStyle=gv(0,-6,10,"#d9b28c","#9c7455");
    g.beginPath(); g.arc(14*sc,-2,6*sc,0,TAU); g.fill();
    g.fillStyle="#13151f"; rr(10*sc,-6,9*sc,3,1.5); g.fill();
    g.globalAlpha=1; g.restore();
  }
  for(const s2 of shells){
    g.save(); g.translate(s2.x,s2.y-2); g.rotate(s2.rot);
    g.globalAlpha=clamp(s2.t*2,0,1);
    g.fillStyle="#d9a94e"; g.fillRect(-2,-1,4,2);
    g.globalAlpha=1; g.restore();
  }
  for(const h2 of hearts){
    g.save(); g.translate(h2.x,h2.y-8);
    const pu=1+0.12*Math.sin(t*7);
    g.scale(pu,pu);
    g.fillStyle="#ff5a76";
    g.beginPath(); g.moveTo(0,3); g.bezierCurveTo(-8,-5,-8,6,0,11); g.bezierCurveTo(8,6,8,-5,0,3); g.fill();
    g.restore();
    g.save(); g.globalCompositeOperation="lighter"; softGlow(h2.x,h2.y-8,16,"255,90,118",0.25); g.restore();
  }
  // door + cage (door lights up only when the district is cleared)
  if(lvl.door!=null)drawDoor(lvl.door,GY,t,(!lvl.cage||cageOpenT>=0)&&enemies.every(e=>e.dead));
  if(lvl.cage){
    if(cageOpenT<0)drawCageBox(lvl.cage-24,GY-52,48,52,true,false);
    else { drawCageBox(lvl.cage-24,GY-52,48,52,false,true);
      if(cageOpenT<2.4)drawDog(lvl.cage+20+cageOpenT*30,GY,1,{walk:true});
      else drawDog(P.x-30,GY,P.face,{walk:Math.abs(P.vx)>20}); }
  }
  for(const e of enemies){ if(e.dead)continue;
    const et=t+e.x*0.01, adxr=Math.abs(P.x-e.x);
    // marksman laser telegraph — a red sightline that snaps to a shot
    if(e.t==="marksman"&&e.tel>0){
      g.save(); g.globalCompositeOperation="lighter";
      g.globalAlpha=0.25+0.55*(1-e.tel/0.72);
      g.strokeStyle="#ff3355"; g.lineWidth=1.1;
      g.beginPath(); g.moveTo(e.x+e.face*20,e.y-30); g.lineTo(P.x,P.y-22); g.stroke();
      g.restore();
    }
    if(e.t==="blade")drawBlade(e.x,e.y,1.26,{t:et,face:e.face,hurt:e.hurtT,lunge:e.lunge||0,rush:adxr<460&&adxr>48});
    else if(e.t==="heavy")drawHeavy(e.x,e.y,1.24,{t:et,face:e.face,tel:e.tel,muzzle:e.muzzle,hurt:e.hurtT});
    else if(e.t==="shield")drawShield(e.x,e.y,1.2,{t:et,face:e.face,hurt:e.hurtT,block:e.block});
    else if(e.t==="marksman")drawMarksman(e.x,e.y,1.2,{t:et,face:e.face,muzzle:e.muzzle,hurt:e.hurtT});
    else if(e.t==="bomber")drawBomber(e.x,e.y,1.2,{t:et,face:e.face,hurt:e.hurtT,fuse:e.fuse});
    else if(e.t==="hound")drawHound(e.x,e.y,1.15,{t:et,face:e.face,hurt:e.hurtT,lunge:e.lunge||0,rush:adxr<640});
    else if(e.t==="zero")drawZero(e.x,e.y,1.15,{t:et,face:e.face,hurt:e.hurtT,tel:e.tel||0,slash:e.slash||0,moving:e.moving});
    else if(e.t==="butcher")drawButcher(e.x,e.y,1.15,{t:et,face:e.face,hurt:e.hurtT,charge:e.charge,pound:e.pound||0,phase:e.phase});
    else drawGoon(e.x,e.y,1.32,{t:et,face:e.face,tel:e.tel,muzzle:e.muzzle,hurt:e.hurtT,pose:Math.abs(e.x-e.px)>2&&adxr>420?"run":"idle"});
    // boss health bar
    if((e.t==="zero"||e.t==="butcher")&&adxr<W*0.7){
      const bw=e.t==="butcher"?120:80, bh=6, by=e.y-(e.t==="butcher"?116:92);
      g.fillStyle="rgba(10,12,20,0.8)"; rr(e.x-bw/2-2,by-2,bw+4,bh+4,3); g.fill();
      g.fillStyle="#3a1220"; rr(e.x-bw/2,by,bw,bh,2); g.fill();
      g.fillStyle=e.t==="butcher"?"#ff4d4d":"#c9d4e8"; rr(e.x-bw/2,by,bw*clamp(e.hp/e.maxhp,0,1),bh,2); g.fill();
      g.fillStyle="#fff"; g.font="900 8px Verdana"; g.textAlign="center";
      g.fillText(e.t==="butcher"?"THE BUTCHER":"ZERO",e.x,by-5);
    }
  }
  // fuses
  for(const f of fuses){ const p=clamp(1-f.t/0.35,0,1);
    g.save(); g.globalCompositeOperation="lighter"; g.globalAlpha=0.5+0.5*Math.sin(performance.now()/28);
    g.strokeStyle="#ffd23f"; g.lineWidth=2.5;
    g.beginPath(); g.arc(f.x,f.y,8+p*90,0,TAU); g.stroke(); g.restore(); }
  // bullets
  for(const b of ebullets){
    g.save(); g.globalCompositeOperation="lighter";
    const br=b.big?4.6:3.4;
    if(b.big){ g.strokeStyle="rgba(255,60,80,0.7)"; g.lineWidth=2.4;
      g.beginPath(); g.moveTo(b.x,b.y); g.lineTo(b.x-b.vx*0.02,b.y-b.vy*0.02); g.stroke(); }
    g.fillStyle=b.big?"#ff2d55":"#ff5340"; g.beginPath(); g.arc(b.x,b.y,br,0,TAU); g.fill();
    g.fillStyle="rgba(255,83,64,0.4)"; g.beginPath(); g.arc(b.x,b.y,br+3,0,TAU); g.fill();
    g.restore(); }
  for(const b of pbullets){
    g.save(); g.globalCompositeOperation="lighter";
    g.strokeStyle=b.holo?"hsl("+((performance.now()/4+b.x)%360)+",95%,70%)":"rgba(255,238,180,0.55)";
    g.lineWidth=4.2;
    g.beginPath(); g.moveTo(b.x,b.y); g.lineTo(b.x-b.vx*0.015,b.y-b.vy*0.015); g.stroke();
    g.strokeStyle=b.holo?"#fff":"rgba(255,248,220,0.95)"; g.lineWidth=1.8;
    g.beginPath(); g.moveTo(b.x,b.y); g.lineTo(b.x-b.vx*0.011,b.y-b.vy*0.011); g.stroke();
    g.fillStyle="#fff"; g.beginPath(); g.arc(b.x,b.y,2,0,TAU); g.fill();
    g.restore(); }
  // player
  if(!P.dead&&P.muzzle>0&&P.grounded){ // muzzle light splashes the ground UNDER the player (ledge or street)
    g.save(); g.globalCompositeOperation="lighter";
    const mg2=g.createRadialGradient(P.x+P.face*46,P.y,6,P.x+P.face*46,P.y,70);
    mg2.addColorStop(0,"rgba(255,214,140,0.22)"); mg2.addColorStop(1,"rgba(255,214,140,0)");
    g.fillStyle=mg2; g.beginPath(); g.ellipse(P.x+P.face*46,P.y,70,13,0,0,TAU); g.fill();
    g.restore();
  }
  if(!P.dead&&!(P.ifr>0&&Math.floor(performance.now()/80)%2===0)){
    const hopts={t,face:P.face,pose:P.grounded?(Math.abs(P.vx)>40?"run":"idle"):"jump",
      gunType:loadoutType||0,holo:loadoutType>10,muzzle:P.muzzle>0?0.55:0,phase:t*11,squash:P.squash||0,dist:P.stride||0};
    drawHero(P.x,P.y,1.15,hopts);
  }
  // particles + floats
  for(const p of parts){
    const a=clamp(p.t*2.6,0,1);
    if(p.cross){ g.save(); g.globalCompositeOperation="lighter"; g.globalAlpha=a;
      g.fillStyle=p.c; const cr=p.r*(1+(1-a)*1.6);
      g.beginPath();
      for(let i=0;i<4;i++){ const ca=i*Math.PI/2+0.78;
        g.moveTo(p.x,p.y); g.lineTo(p.x+Math.cos(ca)*cr,p.y+Math.sin(ca)*cr);
        g.lineTo(p.x+Math.cos(ca+0.42)*cr*0.3,p.y+Math.sin(ca+0.42)*cr*0.3); }
      g.closePath(); g.fill(); g.restore(); continue; }
    if(p.ring){ g.save(); g.globalCompositeOperation="lighter"; g.globalAlpha=a;
      g.strokeStyle=p.c; g.lineWidth=2.4; g.beginPath(); g.arc(p.x,p.y,p.r*(1+(1-a)*3),0,TAU); g.stroke(); g.restore(); continue; }
    if(p.heart){ g.save(); g.globalAlpha=a; g.fillStyle=p.c; g.translate(p.x,p.y-(0.9-p.t)*22);
      g.beginPath(); g.moveTo(0,2); g.bezierCurveTo(-4,-2,-4,3,0,6); g.bezierCurveTo(4,3,4,-2,0,2); g.fill(); g.restore(); continue; }
    g.globalAlpha=a; g.fillStyle=p.c; g.beginPath(); g.arc(p.x,p.y,p.r,0,TAU); g.fill();
  }
  g.globalAlpha=1;
  for(const f of floats){ if(!f.txt)continue;
    g.font="bold "+f.size+"px Verdana"; g.textAlign="center";
    g.globalAlpha=clamp(f.t*2.2,0,1);
    g.lineWidth=4; g.strokeStyle="rgba(0,0,0,0.7)"; g.strokeText(f.txt,f.x,f.y);
    g.fillStyle=f.c; g.fillText(f.txt,f.x,f.y); g.globalAlpha=1; }
  g.restore();
  /* foreground occlusion rail — depth in front of the action */
  g.save(); g.translate(-((camX*1.3)%520),0); g.globalAlpha=0.88;
  for(let i=-1;i<4;i++){
    const fx=i*520;
    g.fillStyle="#05070f";
    rr(fx+40,H-46,7,46,3); g.fill(); rr(fx+260,H-46,7,46,3); g.fill();
    g.fillStyle="rgba(5,7,15,0.9)"; g.fillRect(fx,H-40,520,5);
    g.fillStyle="rgba(9,12,22,0.75)"; g.fillRect(fx,H-24,520,24);
  }
  g.restore();
  /* per-district weather */
  drawWeather(t);
  applyBloom();
  /* per-district split-tone grade + film grain (cinematic photo look; static, no flashing; desktop-only cost) */
  if(cfg.grade>0&&!MOBILE){ const gr=cfg.grade;
    g.save(); g.globalCompositeOperation="multiply"; g.globalAlpha=0.34*gr;
    const sc=g.createLinearGradient(0,0,0,H); sc.addColorStop(0,"#ffffff"); sc.addColorStop(0.55,shade(PAL.skyBot,0.1)); sc.addColorStop(1,PAL.skyTop);
    g.fillStyle=sc; g.fillRect(0,0,W,H); g.restore();
    g.save(); g.globalCompositeOperation="lighter"; g.globalAlpha=0.09*gr;
    const wc=g.createLinearGradient(0,H*0.28,0,H*0.92); wc.addColorStop(0,PAL.farLit); wc.addColorStop(1,"rgba(0,0,0,0)");
    g.fillStyle=wc; g.fillRect(0,0,W,H); g.restore();
    if(!MOBILE){ g.save(); g.globalAlpha=0.05*gr; g.globalCompositeOperation="overlay"; const gt=getGrain();
      for(let yy=0;yy<H;yy+=128)for(let xx=0;xx<W;xx+=128)g.drawImage(gt,xx,yy); g.restore(); }
  }
  /* vignette */
  const v=g.createRadialGradient(W/2,H/2,H*0.5,W/2,H/2,H*0.95);
  v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,"rgba(2,4,10,0.42)");
  g.fillStyle=v; g.fillRect(0,0,W,H);
  /* combo edge-glow — steady ambient warmth at high streaks (no strobe) */
  if(combo>=6){ const cg=clamp((combo-5)/8,0,1)*(0.9+0.1*Math.sin(t*3));
    const eg=g.createRadialGradient(W/2,H/2,H*0.5,W/2,H/2,H*0.98);
    eg.addColorStop(0,"rgba(255,180,60,0)"); eg.addColorStop(1,"rgba("+(combo>=10?"255,80,90":"255,170,70")+","+(0.09*cg)+")");
    g.save(); g.globalCompositeOperation="lighter"; g.fillStyle=eg; g.fillRect(0,0,W,H); g.restore(); }
  /* kill flash — capped low so it reads as a soft pulse, never a strobe */
  if(flash>0.001){ g.save(); g.globalCompositeOperation="lighter"; g.globalAlpha=Math.min(0.3,flash);
    g.fillStyle="rgba("+flashRGB+",1)"; g.fillRect(0,0,W,H); g.restore(); }
  /* style callout */
  if(styleT>0){
    const a=clamp(styleT*2.2,0,1), pop=1+(1-a)*0.25;
    g.save(); g.translate(W/2,H/2-96); g.scale(pop,pop); g.rotate(-0.03);
    g.globalAlpha=a; g.font="900 34px Verdana"; g.textAlign="center";
    g.lineWidth=6; g.strokeStyle="rgba(0,0,0,0.8)"; g.strokeText(styleTxt,0,0);
    g.fillStyle=styleTxt==="BABA YAGA"?"#ff3355":"#ffd75e"; g.fillText(styleTxt,0,0);
    g.restore();
  }
  /* title card */
  if(introT>1&&!gauntlet){
    const a=clamp((introT-1)/1.2,0,1);
    g.fillStyle="rgba(0,0,0,"+(a*0.85)+")";
    g.fillRect(0,0,W,64*a); g.fillRect(0,H-64*a,W,64*a);
    g.save(); g.globalAlpha=a; g.textAlign="center";
    g.font="900 34px Verdana"; g.fillStyle="#e8e8ea";
    g.fillText("CONTRACT "+lvl.name.split(" — ")[0],W/2,H/2-42);
    g.font="900 22px Verdana"; g.fillStyle="#7cf9a5";
    g.fillText(lvl.name.split("— ")[1],W/2,H/2-8);
    g.restore();
  }
  /* gauntlet wave banner */
  if(gauntlet&&gBanner>0){
    const a=clamp(Math.min(gBanner,2.2-gBanner)*2.4,0,1), boss=gWave%10===0, zero=gWave%5===0;
    g.save(); g.globalAlpha=a; g.textAlign="center";
    g.font="900 40px Verdana"; g.lineWidth=6; g.strokeStyle="rgba(0,0,0,0.8)";
    g.strokeText(gBannerTxt,W/2,H/2-70); g.fillStyle=boss?"#ff3355":zero?"#c77dff":"#7cf9a5";
    g.fillText(gBannerTxt,W/2,H/2-70); g.restore();
  }
  drawHUD(t);
  if(state==="play"){ drawBossBar(); if(bossIntro>0)drawBossIntro(); }
  if(tutStep>=0&&state==="play")drawTut();
  if(state==="clear")drawClear();
  if(state==="dead")drawDead();
  if(state==="gover")drawGover();
  if(state==="ending")drawEnding();
}
function drawHUD(t){
  g.font="900 13px Verdana"; g.textAlign="left"; g.fillStyle="#7cf9a5";
  g.fillText(gauntlet?("THE GAUNTLET · WAVE "+gWave):lvl.name,14,24);
  if(bountyActive()){ g.save(); g.textAlign="center"; g.font="900 10px Verdana"; g.fillStyle="#7cf9a5";
    g.fillText("🏆 BOUNTY "+fmtDur(LAUNCH_TS+BOUNTY_MS-Date.now())+" left",W/2,15); g.restore(); }
  g.font="bold 11px Verdana"; g.fillStyle="#8fa3bf";
  g.fillText(lvTime.toFixed(1)+"s",14,42);
  g.fillStyle="#ffd75e"; g.fillText(lvScore.toLocaleString()+" PTS",70,42);
  for(let i=0;i<P.maxhp;i++){
    g.fillStyle=i<P.hp?"#ff3355":"rgba(255,255,255,0.12)";
    const hx=16+i*20, hy=54;
    g.beginPath();
    g.moveTo(hx,hy+3); g.bezierCurveTo(hx-7,hy-4,hx-7,hy+5,hx,hy+10);
    g.bezierCurveTo(hx+7,hy+5,hx+7,hy-4,hx,hy+3); g.fill();
  }
  g.font="900 13px Verdana"; g.textAlign="left"; g.fillStyle="#ff6b7a";
  g.fillText("☠ ×"+lvKills,W-118,27);
  if(!gauntlet){ const la=enemies.reduce((n,e)=>n+(e.dead?0:1),0);
    g.font="900 11px Verdana"; g.fillStyle=la?"#ffb15e":"#7cf9a5";
    g.fillText(la?(la+" LEFT"):"CLEAR ✓ → DOOR",W-118,74);
    // tracker: last stragglers get an edge arrow so backtracking never means wandering
    if(la>0&&la<=4){ const nr=enemies.filter(e=>!e.dead).sort((a,b)=>Math.abs(a.x-P.x)-Math.abs(b.x-P.x))[0];
      if(nr){ const sx=nr.x-camX;
        if(sx<-10||sx>W+10){ const right=sx>W, ax=right?W-26:26, dist=Math.round(Math.abs(nr.x-P.x));
          g.save(); g.globalAlpha=0.66+0.3*Math.sin(t*5); g.textAlign="center";
          g.font="900 20px Verdana"; g.fillStyle="#ffb15e"; g.fillText(right?"▶":"◀",ax,H/2);
          g.font="bold 10px Verdana"; g.fillText(dist+"px",ax,H/2+16); g.restore(); g.textAlign="left"; } } }
  }
  const sp=specFor(loadoutType);
  g.textAlign="right";
  g.fillStyle=sp.holo?"hsl("+(performance.now()/12%360)+",90%,65%)":"#cfd6e0";
  g.font="900 11px Verdana"; g.fillText(sp.name,W-14,46);
  if(ownedGunTypes.length){ g.font="bold 9px Verdana"; g.fillStyle="rgba(160,175,200,0.55)";
    g.fillText(MOBILE?"tap to swap":"Q — swap",W-14,58); }
  if(combo>1){ g.font="900 22px Verdana"; g.textAlign="center";
    g.lineWidth=4; g.strokeStyle="rgba(0,0,0,0.75)"; g.strokeText(combo+"×",W/2,46);
    g.fillStyle=combo>=5?"#ffd75e":"#fff"; g.fillText(combo+"×",W/2,46);
    g.fillStyle="rgba(255,255,255,0.16)"; rr(W/2-34,54,68,4,2); g.fill();
    g.fillStyle=combo>=5?"#ffd75e":"#7cf9a5"; rr(W/2-34,54,68*clamp(comboT/2.2,0,1),4,2); g.fill(); }
  if(introT>0){ g.save(); g.globalAlpha=clamp(introT/0.5,0,1);
    g.font="italic 13px Georgia,serif"; g.textAlign="center"; g.fillStyle="#e8b04a";
    g.fillText(lvl.lore,W/2,86);
    g.font="bold 11px Verdana"; g.fillStyle="#8fa3bf";
    g.fillText(MOBILE?(tiltOn?"tilt to move · tap right side to jump · auto-fire":"hold & slide left side — move · tap right side — jump · auto-fire"):"A/D move · SPACE / W — jump (hold = higher) · CLICK / mouse — fire · stomp heads",W/2,108);
    g.restore(); }
  if(MOBILE)drawTouchControls();
}
function drawTouchControls(){

function drawBoard(){

  const sky=g.createLinearGradient(0,0,0,H);

/* ---------- bloom (quarter-res, the proven WICK pipeline) ---------- */
function makeCanvas(w,h){ const c=document.createElement("canvas"); c.width=w; c.height=h; return c; }
const BLOOM=makeCanvas(480,270), BLOOMC=BLOOM.getContext("2d");
const BLOOM2=makeCanvas(480,270), BLOOM2C=BLOOM2.getContext("2d");
const BLOOM3=makeCanvas(240,135), BLOOM3C=BLOOM3.getContext("2d");
const FILTER_OK=(function(){ try{ const c=document.createElement("canvas").getContext("2d"); c.filter="blur(1px)"; return c.filter!=="none"&&c.filter!==""; }catch(e){ return false; } })();
function applyBloom(){
  if(MOBILE||!FILTER_OK){   // no ctx.filter support → use the cheap downscale glow instead of a broken pass
    // cheap glow for touch devices: single downscale + smooth additive upscale (one pass — phones feel it)
    BLOOM3C.setTransform(1,0,0,1,0,0); BLOOM3C.globalCompositeOperation="source-over"; BLOOM3C.clearRect(0,0,240,135);
    BLOOM3C.drawImage(cv,0,0,240,135);
    g.save(); g.globalCompositeOperation="lighter"; g.globalAlpha=0.22; g.imageSmoothingEnabled=true;
    g.drawImage(BLOOM3,0,0,240,135,0,0,W,H); g.restore();
    return;
  }
  BLOOMC.setTransform(1,0,0,1,0,0); BLOOMC.globalCompositeOperation="source-over"; BLOOMC.filter="none";
  BLOOMC.clearRect(0,0,480,270); BLOOMC.drawImage(cv,0,0,480,270);
  BLOOMC.globalCompositeOperation="multiply"; BLOOMC.drawImage(BLOOM,0,0);
  BLOOM2C.setTransform(1,0,0,1,0,0); BLOOM2C.clearRect(0,0,480,270);
  BLOOM2C.filter="blur(5px) saturate(1.6) brightness(1.75)"; BLOOM2C.drawImage(BLOOM,0,0); BLOOM2C.filter="none";
  g.save(); g.globalCompositeOperation="lighter"; g.globalAlpha=0.4; g.drawImage(BLOOM2,0,0,W,H); g.restore();
}

/* ---------- loop ---------- */
let last=performance.now(), acc=0; const STEP=1/60;
const isPortrait=()=>{ try{ return MOBILE&&matchMedia("(orientation: portrait)").matches; }catch(e){ return false; } };
function frame(now){
  let el=(now-last)/1000; last=now;
  if(el<0)el=0; if(el>0.12)el=0.12;                                  // returning from a stall never bursts the sim
  if(document.hidden||isPortrait()){ acc=0; }                        // hidden tab / rotate overlay = PAUSED, not dying off-screen
  else { acc+=el; let n=0;
    while(acc>=STEP&&n<8){ update(STEP); acc-=STEP; n++; } }
  render();
  if(document.hidden)setTimeout(()=>frame(performance.now()),200); else requestAnimationFrame(frame);
}
frame(performance.now());

/* dev harness */
window.PW={
  get state(){return state}, set state(s){state=s;},
  get P(){return P}, get enemies(){return enemies}, get lvl(){return lvl}, get camX(){return camX},
  get coins(){return coins}, get crates(){return crates}, get kegs(){return kegs},
  get score(){return lvScore}, get combo(){return combo}, get hp(){return P?P.hp:0},
  start(i){ startLevel(i); },
  key(k,down){ if(down)keys.add(k); else keys.delete(k); },
  jump(){ if(P){P.jbuf=0.16;P.jumpHeld=true;setTimeout(()=>{if(P)P.jumpHeld=false;},260);} },
  fire(){ fireGun(); }, hold(v){ firing=!!v; },
  setLoadout(types,tp){ ownedGunTypes=types||[]; loadoutType=tp!=null?tp:(types&&types[0]); walletAddr="0xTEST"; walletStatus="✓ test"; },
  pump(sec){ for(let i=0,n=Math.round(sec*60);i<n;i++)update(1/60); render(); },
  shot:async()=>{ await fetch("/shot",{method:"POST",body:cv.toDataURL()}); return "ok"; }
};
