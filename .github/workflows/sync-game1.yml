name: Sync game1 from upstream

# Pulls mtwhv5ktjr-bot/pepe-wick@main into game1/play/ and re-applies the two
# local post-processing steps, so an upstream release lands here without a ping.
#
# Post-processing exists because a plain copy would regress the site:
#   1. the mobile-wallet deeplink upstream points at pepe-zero.vercel.app
#   2. upstream ships icon-192 and apple-touch-icon as 512x512 115KB copies
# Applied by tools/apply_local_patches.py, which exits non-zero if an upstream
# change moved a patch target, so a half-patched game never ships.
# Sprites are NOT touched: upstream ships pre-keyed WebP with real alpha.

on:
  schedule:
    - cron: '*/30 * * * *'      # every 30 min
  workflow_dispatch:            # or run it by hand from the Actions tab

concurrency:
  group: sync-game1
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream
        run: |
          set -euo pipefail
          curl -fsSL https://api.github.com/repos/mtwhv5ktjr-bot/pepe-wick/tarball/main -o up.tar.gz
          mkdir -p upstream
          tar xzf up.tar.gz -C upstream --strip-components=1
          test -f upstream/index.html || { echo "upstream index.html missing - refusing to sync"; exit 1; }
          bytes=$(wc -c < upstream/index.html)
          test "$bytes" -gt 50000 || { echo "upstream index.html only $bytes bytes - refusing to sync"; exit 1; }

      # --delete so files removed upstream also disappear here
      - name: Copy into game1/play
        run: |
          set -euo pipefail
          mkdir -p game1/play
          rsync -a --delete --exclude '.git*' upstream/ game1/play/
          rm -rf upstream up.tar.gz

      - name: Re-apply local patches
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 tools/apply_local_patches.py

      - name: Sanity-check before committing
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, os, sys
          h = open("game1/play/index.html", encoding="utf-8").read()
          refs = re.findall(r'file:"(hero_[a-z_]+\.[a-z]+)"', h)
          if len(refs) != 11:
              sys.exit(f"expected 11 sheet refs, found {len(refs)}")
          missing = [r for r in refs if not os.path.exists(f"game1/play/{r}")]
          if missing:
              sys.exit(f"game references sheets that are not present: {missing}")
          if "games.wick.pics/game1" not in h:
              sys.exit("deeplink not patched")
          print(f"sanity OK: {len(refs)} sheets referenced and present, deeplink patched")
          PY

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          git add -A game1/play                 # -A so new .webp and removed .png both count
          if git diff --cached --quiet; then
            echo "no upstream change"
            exit 0
          fi
          git config user.name  "games-wick-sync"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "sync game1 from mtwhv5ktjr-bot/pepe-wick@main"
          git push
